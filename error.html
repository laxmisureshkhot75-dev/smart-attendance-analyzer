{% extends "base.html" %}
{% block title %}{{ code }} Error{% endblock %}
{% block content %}
<div class="panel text-center error-box">
  <div class="error-code">{{ code }}</div>
  <h3>{{ title }}</h3>
  <p class="text-muted">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('dashboard') }}"><i class="fa-solid fa-house me-1"></i> Go to Dashboard</a>
</div>
{% endblock %}
